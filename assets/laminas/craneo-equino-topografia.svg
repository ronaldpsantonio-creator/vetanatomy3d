<!-- labels -->
<g font-family="Arial,sans-serif" font-size="18" fill="#183b33" stroke="#537568" stroke-width="2">
 <path d="M580 160 L580 122 L525 122" fill="none"/><text x="515" y="116" text-anchor="end" stroke="none" font-weight="700">Parietal</text>
 <path d="M770 205 L800 140 L865 140" fill="none"/><text x="875" y="146" stroke="none" font-weight="700">Occipital</text>
 <path d="M520 245 L480 160 L390 160" fill="none"/><text x="380" y="166" text-anchor="end" stroke="none" font-weight="700">Frontal</text>
 <path d="M860 290 L920 235 L1010 235" fill="none"/><text x="1020" y="241" stroke="none" font-weight="700">Temporal</text>
 <path d="M430 330 L360 250 L270 250" fill="none"/><text x="260" y="256" text-anchor="end" stroke="none" font-weight="700">Lagrimal / cigomático</text>
