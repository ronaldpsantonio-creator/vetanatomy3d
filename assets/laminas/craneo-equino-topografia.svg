<g font-family="Arial,sans-serif" font-size="15" fill="#64766d">
 <text x="58" y="665">Esquema didáctico original: los colores indican regiones aproximadas, no suturas exactas.</text>
 <text x="58" y="690">Para localizar forámenes, canales, senos y superficies articulares consulta cada ficha y una pieza anatómica.</text>
 <text x="58" y="724" font-weight="700" fill="#9a5d35">No usar como imagen diagnóstica ni como sustituto de una lámina anatómica detallada.</text>
</g>
</svg>