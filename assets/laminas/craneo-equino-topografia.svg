<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Mapa topográfico original del cráneo equino</title>
<desc id="d">Esquema lateral simplificado que ubica grupos de huesos del neurocráneo y del esqueleto facial. No representa límites suturales exactos ni sustituye un atlas anatómico.</desc>
<defs>
 <linearGradient id="bone" x2="0" y2="1"><stop stop-color="#f3e7ce"/><stop offset="1" stop-color="#d8c5a2"/></linearGradient>
 <linearGradient id="shade" x2="1" y2="1"><stop stop-color="#d6c5a8"/><stop offset="1" stop-color="#b69d7b"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#30443a" flood-opacity=".18"/></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="#f7f8f3"/>
<text x="56" y="62" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183b33">CRÁNEO EQUINO · MAPA TOPOGRÁFICO</text>
<text x="56" y="94" font-family="Arial,sans-serif" font-size="16" fill="#63766d">Vista lateral esquemática · identificación regional de huesos</text>
